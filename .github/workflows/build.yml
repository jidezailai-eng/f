name: ARM64 Build Pipeline

on:
  push:
    branches: [ "main", "master", "Base" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-24.04 

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu ccache flex bison libssl-dev libelf-dev bc

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-aarch64-ccache
          max-size: 5G

      - name: Pre-Patch Broken Huawei Drivers (The Big Hammer)
        run: |
          echo "Applying static inline fixes to coul event header to fix linker collisions..."
          sed -i 's/void hisi_coul/static inline void hisi_coul/g' include/linux/power/hisi/coul/hisi_coul_event.h || true
          sed -i 's/int hisi_call/static inline int hisi_call/g' include/linux/power/hisi/coul/hisi_coul_event.h || true
          
          echo "Hollowing out ALL Kirin display drivers to bypass missing lcd_kit headers..."
          find drivers/video/fbdev/hisi/ -type f -name "*.c" -exec sh -c 'echo "" > "$1"' _ {} \; || true
          
          echo "Hollowing out broken USB network gadget..."
          echo "" > drivers/usb/gadget/function/f_rndis.c || true

      - name: Generate Kernel .config
        run: |
          make ARCH=arm64 Mate20_kirin980_defconfig
          
          # Disable Stack Protector
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' .config
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/g' .config
          
          # Disable CFI and LTO directly in config
          sed -i 's/CONFIG_CFI_CLANG=y/# CONFIG_CFI_CLANG is not set/g' .config
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' .config
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' .config
          sed -i 's/CONFIG_SHADOW_CALL_STACK=y/# CONFIG_SHADOW_CALL_STACK is not set/g' .config
          sed -i 's/CONFIG_GCC_PLUGINS=y/# CONFIG_GCC_PLUGINS is not set/g' .config
          
          # Force the configuration
          make ARCH=arm64 olddefconfig

      - name: Compile Kernel Image
        run: |
          # Pass DISABLE_GCC_PLUGINS directly to make to override any stubborn config dependencies
          make ARCH=arm64 \
               HOSTCFLAGS="-fcommon" \
               KCFLAGS="-Wno-error -w" \
               DISABLE_GCC_PLUGINS=1 \
               CONFIG_LTO=n \
               CC="ccache aarch64-linux-gnu-gcc" \
               CROSS_COMPILE="aarch64-linux-gnu-" \
               Image.gz -j$(nproc)
