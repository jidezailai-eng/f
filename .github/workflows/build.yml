name: ARM64 Build Pipeline

on:
  push:
    branches: [ "main", "master", "Base" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-24.04 

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu ccache flex bison libssl-dev libelf-dev bc

      # --- NEW: GEMINI CLI IMPLEMENTATION ---
      - name: Setup Node.js (Required for Gemini CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli
      # --------------------------------------

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-aarch64-ccache
          max-size: 5G

      # --- NEW: KERNEL CONFIGURATION ---
      - name: Generate Kernel .config
        run: |
          # Replace 'YOUR_DEFCONFIG_NAME' with the actual config for your device
          # (e.g., kirin980_defconfig, vendor/hisi_defconfig, etc.)
          make ARCH=arm64 YOUR_DEFCONFIG_NAME
      # ---------------------------------

      - name: Compile Binary with Gemini Auto-Patching
        env:
          # You MUST add your API key to GitHub Repository Secrets as GEMINI_API_KEY
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
        run: |
          # This runs the build. If it fails, Gemini CLI jumps in to patch the Makefiles.
          while ! make ARCH=arm64 HOSTCFLAGS="-fcommon" KCFLAGS="-Wno-error -w" CC="ccache aarch64-linux-gnu-gcc" CROSS_COMPILE="aarch64-linux-gnu-" Image.gz -j$(nproc) > build_error.log 2>&1; do
              echo "Build failed! Triggering Gemini CLI to analyze and patch..."
              
              gemini -p "Analyze the compilation errors at the end of 'build_error.log'. Disable the failing drivers in their respective Makefiles or hollow out the failing .c files. Auto-accept all file edits."
              
              echo "Patching complete. Restarting compiler..."
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: compiled-image
          path: arch/arm64/boot/Image.gz
          retention-days: 7
